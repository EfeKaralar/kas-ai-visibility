destination:
  name: "Kaş"
  center: [36.1994, 29.6413]          # lat, lon (OSM place=town)
  polygon_file: config/kas_polygon.geojson

place_collection:
  keywords: ["hotel", "otel", "pansiyon", "apart"]   # pansiyon/apart added after OSM cross-check showed missing small properties
  grid_spacing_km: 0.8                 # grid points over the polygon's bounding box
  max_pages: 3                         # stop earlier when a page adds no new places
  # A place is accommodation if any of its Google categories is listed here. Rental agencies
  # that manage many properties, restaurants, bars, beaches and attractions are not.
  accommodation_categories:
    - Hotel
    - Resort hotel
    - Extended stay hotel
    - Love hotel                       # Google mislabels adults-only hotels this way
    - Motel
    - Hostel
    - Lodging
    - Indoor lodging
    - Lodge
    - Guest house
    - Pension office
    - Boarding house
    - Bed & breakfast
    - Apartment
    - Apartment building               # small "apart" rentals are often filed under this
    - Furnished apartment building
    - Apartment rental agency          # in Kaş these are single apart properties
    - Serviced apartment
    - Serviced accommodation
    - Self-catering accommodation
    - Holiday apartment
    - Holiday apartment rental
    - Holiday home
    - Vacation Rental
    - House
    - Villa
    - Campground

serper:
  zoom: "16z"
  language: "en"
  credits_per_maps_call: 3             # assumed until the first response reports actual credits
  credit_cap: 2000                     # of the 2,500 free signup credits; leaves room for name lookups

models:                                # LangChain "provider:model" strings
  helper: "deepseek:deepseek-chat"     # DeepSeek V3.2 non-thinking: prompt writing, matching, labelling

engines:                               # plain calls: user prompt only, provider defaults otherwise
  openai:
    model: "openai:gpt-6-luna"
    init: {use_responses_api: true, include: ["web_search_call.action.sources"]}
    tools: [{type: web_search}]
  gemini:
    model: "google_genai:gemini-3.8-flash"
    init: {}
    tools: [{google_search: {}}]
  anthropic:
    model: "anthropic:claude-haiku-5-5"
    init: {max_tokens: 8000}
    tools: [{type: web_search_20250305, name: web_search, max_uses: 5}]   # max_uses is a cost guard

engine_queries:
  repeats: 3
  workers: 6                           # concurrent calls across engines
  timeout_seconds: 180
  retries: 3                           # per call, exponential backoff on errors
  pilot_base_prompts: [couple_quiet_1, family_kids_1, remote_worker_1, honeymooners_2]   # x4 languages x3 engines, repeat 1

prompt_generation:
  languages: [en, tr, de, ru]
  styles:                              # rotated across base prompts for natural variety
    - "short and direct, like a quick message"
    - "conversational, like asking a well-travelled friend"
    - "a little more detailed, explaining the situation first"

budget:
  warn_usd: 30
  hard_cap_usd: 50
  ledger_file: data/budget_ledger.jsonl
